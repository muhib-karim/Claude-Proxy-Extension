<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">Claude Proxy Extension</title>
  <desc id="desc">VS Code status bar extension: per-window model switching and live quota monitoring for a local Claude/Gemini proxy.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#3b0764"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>

  <!-- Title + tagline -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="72" y="128" font-size="58" font-weight="700" fill="#f8fafc">Claude Proxy Extension</text>
    <rect x="74" y="148" width="120" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="72" y="196" font-size="24" fill="#cbd5e1">Per-window model switching and live quota monitoring</text>
    <text x="72" y="230" font-size="24" fill="#cbd5e1">for a local Claude / Gemini proxy, right in the VS Code status bar.</text>
  </g>

  <!-- Motif: quota card + status bar -->
  <g transform="translate(860,64)" font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect width="356" height="146" rx="12" fill="#0b1220" fill-opacity="0.75" stroke="#a78bfa" stroke-opacity="0.45"/>
    <text x="20" y="34" font-size="15" font-weight="600" fill="#e2e8f0">Model Quotas</text>

    <text x="20" y="72" font-size="15" fill="#fbbf24">Claude</text>
    <g fill="#f59e0b">
      <rect x="92" y="60" width="18" height="14" rx="3"/><rect x="114" y="60" width="18" height="14" rx="3"/>
      <rect x="136" y="60" width="18" height="14" rx="3"/><rect x="158" y="60" width="18" height="14" rx="3"/>
      <rect x="180" y="60" width="18" height="14" rx="3"/><rect x="202" y="60" width="18" height="14" rx="3"/>
      <rect x="224" y="60" width="18" height="14" rx="3"/>
    </g>
    <g fill="none" stroke="#f59e0b" stroke-opacity="0.6">
      <rect x="246.5" y="60.5" width="17" height="13" rx="3"/><rect x="268.5" y="60.5" width="17" height="13" rx="3"/>
      <rect x="290.5" y="60.5" width="17" height="13" rx="3"/>
    </g>

    <text x="20" y="112" font-size="15" fill="#c4b5fd">Gemini</text>
    <g fill="#a78bfa">
      <rect x="92" y="100" width="18" height="14" rx="3"/><rect x="114" y="100" width="18" height="14" rx="3"/>
      <rect x="136" y="100" width="18" height="14" rx="3"/><rect x="158" y="100" width="18" height="14" rx="3"/>
    </g>
    <g fill="none" stroke="#a78bfa" stroke-opacity="0.6">
      <rect x="180.5" y="100.5" width="17" height="13" rx="3"/><rect x="202.5" y="100.5" width="17" height="13" rx="3"/>
      <rect x="224.5" y="100.5" width="17" height="13" rx="3"/><rect x="246.5" y="100.5" width="17" height="13" rx="3"/>
      <rect x="268.5" y="100.5" width="17" height="13" rx="3"/><rect x="290.5" y="100.5" width="17" height="13" rx="3"/>
    </g>
  </g>

  <!-- Status bar strip -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="0" y="282" width="1280" height="38" fill="#4c1d95" fill-opacity="0.85"/>
    <circle cx="88" cy="301" r="7" fill="none" stroke="#e9d5ff" stroke-width="2"/>
    <text x="104" y="307" font-size="16" fill="#f5f3ff">Account</text>
    <rect x="190" y="288" width="142" height="26" rx="5" fill="#ffffff" fill-opacity="0.12"/>
    <circle cx="208" cy="301" r="5" fill="#a78bfa"/>
    <text x="222" y="307" font-size="16" fill="#f5f3ff">Pro · window</text>
    <circle cx="1188" cy="301" r="5" fill="#34d399"/>
    <text x="1200" y="307" font-size="14" fill="#d1fae5">:8080</text>
  </g>
</svg>
